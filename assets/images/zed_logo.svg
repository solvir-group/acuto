<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  Acuto mark.

  An acute apex - the name means "sharp" - drawn as a single angular stroke with
  a crossbar, reading as an "A". Geometry only, no fill, so GPUI's mask rendering
  tints it with the theme color like every other vector here.

  The filename stays zed_logo.svg because VectorName maps enum variants to paths
  by name; renaming the file would mean touching an enum in crates/ui and paying
  a 71-dependent rebuild to change a picture.
-->
<path d="M48 12 L84 84" stroke="black" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 12 L12 84" stroke="black" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M27 62 L69 62" stroke="black" stroke-width="9" stroke-linecap="round"/>
</svg>
